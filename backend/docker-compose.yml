version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhusetu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhusetu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bhusetu_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: bhusetu_postgres_data
