[pytest]
# The repo has two separate `tests` packages: `tests/` at the root and
# `backend/tests/`. Under pytest's default prepend import mode whichever is
# collected first claims the module name `tests`, so the other one fails to
# import (`ModuleNotFoundError: No module named 'tests.e2e'`). Importlib mode
# loads each test module from its own file path, so neither shadows the other.
addopts = --import-mode=importlib
